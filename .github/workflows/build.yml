name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ForgeGradle 2.0.2 работает только на JDK 8.
      - name: JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      # И только на старом Gradle. Новые ветки его ломают.
      - name: Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip -d $HOME
          echo "$HOME/gradle-2.14.1/bin" >> $GITHUB_PATH

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: forge189-v5-${{ hashFiles('**/*.gradle') }}
          restore-keys: forge189-v5-

      # Заглушка и сборка идут одним шагом: фоновый процесс не гарантированно
      # живёт до следующего шага. Маршрутизация — через systemProp в
      # gradle.properties, так как сборка идёт в отдельной форкнутой JVM.
      - name: Сборка
        run: |
          # Прошлые падения могли оставить в кеше битые манифесты.
          rm -rf ~/.gradle/caches/minecraft

          python3 .github/shim.py 8080 > /tmp/shim.log 2>&1 &
          SHIM_PID=$!
          trap "kill $SHIM_PID 2>/dev/null || true" EXIT

          for i in $(seq 1 20); do
            if curl -sf -x http://127.0.0.1:8080 http://export.mcpbot.bspk.rs/versions.json > /dev/null; then
              break
            fi
            sleep 1
          done

          echo "--- versions.json через заглушку ---"
          curl -sS -x http://127.0.0.1:8080 http://export.mcpbot.bspk.rs/versions.json
          echo

          MCJSON=/tmp/1.8.9.json
          curl -sf -x http://127.0.0.1:8080 \
            http://s3.amazonaws.com/Minecraft.Download/versions/1.8.9/1.8.9.json -o "$MCJSON"
          grep -q '"id"' "$MCJSON"
          echo "манифест 1.8.9 получен, $(wc -c < "$MCJSON") байт"

          C="$HOME/.gradle/caches/minecraft"

          # extractUserdev ищет манифест файлом на диске, и в каком именно
          # каталоге — угадать не удалось, поэтому кладём во все сразу.
          sprinkle() {
            mkdir -p "$C"
            find "$C" -maxdepth 8 -type d -exec cp "$MCJSON" {}/1.8.9.json \; 2>/dev/null || true
            for d in "$HOME/.minecraft/versions/1.8.9" "$PWD" "$PWD/build/tmp" "$PWD/run"; do
              mkdir -p "$d" && cp "$MCJSON" "$d/1.8.9.json" || true
            done
            echo "манифест разложен в $(find "$C" -maxdepth 8 -name '1.8.9.json' | wc -l) каталогов кеша"
          }

          sprinkle

          # Качает Forge и MCP и декомпилирует майнкрафт.
          # Первый запуск минут пятнадцать, дальше берётся из кеша.
          if ! gradle setupDecompWorkspace --no-daemon --stacktrace; then
            echo "=== первая попытка не удалась ==="
            echo "Теперь созданы каталоги, которых до запуска не было — повторяю раскладку."
            sprinkle

            if ! gradle setupDecompWorkspace --no-daemon --stacktrace; then
              echo "=== диагностика: ищем в отладочном логе точный путь ==="
              gradle extractUserdev --no-daemon --debug > /tmp/debug.log 2>&1 || true
              echo "--- строки про inherit ---"
              grep -n -i -B3 -A8 'inherit' /tmp/debug.log | head -120 || true
              echo "--- строки про versionJsons и 1.8.9.json ---"
              grep -n -i 'versionJsons\|1\.8\.9\.json' /tmp/debug.log | head -60 || true
              exit 1
            fi
          fi

          gradle build --no-daemon --stacktrace

      # Видно, какие адреса дёргал ForgeGradle и что им отдала заглушка.
      - name: Лог заглушки
        if: always()
        run: tail -n 200 /tmp/shim.log || true

      - name: Содержимое кеша
        if: always()
        run: |
          find ~/.gradle/caches/minecraft -maxdepth 6 \( -name '*.json' -o -name '*.jar' \) \
            -printf '%10s  %p\n' 2>/dev/null | sort -k2 || true

      - name: artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoblockhit-jar
          path: build/libs/*.jar
