name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ForgeGradle 2.0.2 работает только на JDK 8.
      - name: JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      # И только на старом Gradle. Новые ветки его ломают.
      - name: Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip -d $HOME
          echo "$HOME/gradle-2.14.1/bin" >> $GITHUB_PATH

      # MCPBot (export.mcpbot.bspk.rs) выключен в 2022 году, домен больше
      # не существует. ForgeGradle 2.0.2 всё равно ходит на него за
      # versions.json и падает. Поднимаем локальную заглушку на порту 80
      # и заворачиваем этот домен на 127.0.0.1 через /etc/hosts.
      # versions.json отдаём свой, всё остальное перенаправляем
      # на живое зеркало маппингов в maven Forge.
      - name: MCPBot shim
        run: |
          cat > /tmp/versions.json <<'JSON'
          {
            "1.8.9": {
              "stable": [22, 20],
              "stable_nodoc": [22, 20],
              "snapshot": [20161208, 20160312],
              "snapshot_nodoc": [20161208, 20160312]
            }
          }
          JSON
          cat > /tmp/shim.py <<'PY'
          import http.server, socketserver, hashlib

          MAVEN = "https://maven.minecraftforge.net/de/oceanlabs/mcp"
          DATA = open("/tmp/versions.json", "rb").read()
          ETAG = '"' + hashlib.md5(DATA).hexdigest() + '"'

          class H(http.server.BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"

              def do_GET(self):
                  if self.path.startswith("/versions.json"):
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(DATA)))
                      self.send_header("ETag", ETAG)
                      self.end_headers()
                      self.wfile.write(DATA)
                  else:
                      self.send_response(302)
                      self.send_header("Location", MAVEN + self.path)
                      self.send_header("Content-Length", "0")
                      self.end_headers()

              def do_HEAD(self):
                  self.do_GET()

              def log_message(self, fmt, *args):
                  print("shim: " + (fmt % args), flush=True)

          socketserver.TCPServer.allow_reuse_address = True
          httpd = socketserver.TCPServer(("127.0.0.1", 80), H)
          httpd.serve_forever()
          PY
          echo "127.0.0.1 export.mcpbot.bspk.rs" | sudo tee -a /etc/hosts
          sudo nohup python3 /tmp/shim.py > /tmp/shim.log 2>&1 &
          sleep 3
          echo "--- проверка заглушки ---"
          curl -sS http://export.mcpbot.bspk.rs/versions.json
          echo

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: forge189-${{ hashFiles('**/*.gradle') }}
          restore-keys: forge189-

      # Качает Forge и MCP и декомпилирует майнкрафт.
      # Первый запуск минут пятнадцать, дальше берётся из кеша.
      - name: setupDecompWorkspace
        run: gradle setupDecompWorkspace --no-daemon --stacktrace

      - name: build
        run: gradle build --no-daemon --stacktrace

      # Лог заглушки: видно, какие адреса дёргал ForgeGradle.
      - name: shim log
        if: always()
        run: cat /tmp/shim.log || true

      - name: artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoblockhit-jar
          path: build/libs/*.jar
