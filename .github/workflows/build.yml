name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ForgeGradle 2.3 всё равно требует JDK 8.
      - name: JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      # Ветка 2.3 работает на Gradle 4.4.1 (а не на 2.14.1, как 2.0.2).
      - name: Gradle 4.4.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-4.4.1-bin.zip
          unzip -q gradle-4.4.1-bin.zip -d $HOME
          echo "$HOME/gradle-4.4.1/bin" >> $GITHUB_PATH

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: forge189-fg23-${{ hashFiles('**/*.gradle') }}
          restore-keys: forge189-fg23-

      # Заглушка и сборка идут одним шагом: фоновый процесс не гарантированно
      # живёт до следующего шага. Маршрутизация — через systemProp в
      # gradle.properties, так как сборка идёт в отдельной форкнутой JVM.
      - name: Сборка
        run: |
          # Кеш от ветки 2.0.2 несовместим с 2.3 по раскладке каталогов.
          rm -rf ~/.gradle/caches/minecraft

          python3 .github/shim.py 8080 > /tmp/shim.log 2>&1 &
          SHIM_PID=$!
          trap "kill $SHIM_PID 2>/dev/null || true" EXIT

          for i in $(seq 1 20); do
            if curl -sf -x http://127.0.0.1:8080 http://export.mcpbot.bspk.rs/versions.json > /dev/null; then
              break
            fi
            sleep 1
          done

          C="$HOME/.gradle/caches/minecraft"
          mkdir -p "$C"

          # В прошлом прогоне в кеше нашлся McpMappings.json на 131 байт —
          # это ровно то, что заглушка отдаёт вместо мёртвого MCPBot.
          # Значит его можно положить заранее и не зависеть от MCPBot вообще.
          curl -sf -x http://127.0.0.1:8080 \
            http://export.mcpbot.bspk.rs/versions.json -o "$C/McpMappings.json"
          echo "McpMappings.json: $(wc -c < "$C/McpMappings.json") байт"

          # Манифест 1.8.9 кладём в versionJsons заранее — точный путь
          # подтверждён отладочным логом: {CACHE_DIR}/versionJsons.
          MCJSON=/tmp/1.8.9.json
          curl -sf -x http://127.0.0.1:8080 \
            http://s3.amazonaws.com/Minecraft.Download/versions/1.8.9/1.8.9.json -o "$MCJSON"
          grep -q '"id"' "$MCJSON"
          mkdir -p "$C/versionJsons"
          cp "$MCJSON" "$C/versionJsons/1.8.9.json"
          echo "манифест 1.8.9: $(wc -c < "$MCJSON") байт, положен в versionJsons"

          gradle --version

          # Качает Forge и MCP и декомпилирует майнкрафт.
          # Первый запуск минут пятнадцать, дальше берётся из кеша.
          if ! gradle setupDecompWorkspace --no-daemon --stacktrace; then
            echo "=== диагностика ==="
            echo "--- что лежит в versionJsons ---"
            ls -la "$C/versionJsons" || true
            echo "--- все адреса, которые разрешал плагин ---"
            gradle setupDecompWorkspace --no-daemon --debug > /tmp/debug.log 2>&1 || true
            grep -n 'Resolved:' /tmp/debug.log | head -60 || true
            echo "--- последние 60 строк перед ошибкой ---"
            grep -n -B60 'What went wrong' /tmp/debug.log | head -80 || true
            exit 1
          fi

          gradle build --no-daemon --stacktrace

      # Видно, какие адреса дёргал ForgeGradle и что им отдала заглушка.
      - name: Лог заглушки
        if: always()
        run: tail -n 200 /tmp/shim.log || true

      - name: Содержимое кеша
        if: always()
        run: |
          find ~/.gradle/caches/minecraft -maxdepth 6 \( -name '*.json' -o -name '*.jar' \) \
            -printf '%10s  %p\n' 2>/dev/null | sort -k2 || true

      - name: artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoblockhit-jar
          path: build/libs/*.jar
