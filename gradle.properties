org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false

# Заворачиваем весь HTTP сборки на локальную заглушку (.github/shim.py):
# в ForgeGradle 2.0.2 зашиты адреса MCPBot и s3.amazonaws.com, которых больше нет.
# Именно systemProp, а не GRADLE_OPTS: сборка идёт в отдельной форкнутой JVM,
# и переменные окружения до неё не доходят.
# HTTPS не затрагивается: maven репозитории работают напрямую.
# На локальной машине без заглушки эти две строки надо закомментировать.
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=8080
systemProp.http.nonProxyHosts=localhost|127.0.0.1
